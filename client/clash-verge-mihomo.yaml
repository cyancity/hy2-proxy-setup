# Clash Verge Rev / Mihomo 完整客户端订阅与分流配置模板
# 使用前请替换:
# 1. <SERVER_IP> 替换为服务器公网 IP
# 2. <PASSWORD> 替换为服务端的连接密码

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
# 严格禁用 IPv6，避免双栈下通过国内运营商公网 IPv6 真实直连导致位置泄露
ipv6: false
unified-delay: true
external-controller: 127.0.0.1:9097

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.ts.net"
    - "+.lan"
    - "+.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "*.msftncsi.com"
    - "+.msftconnecttest.com"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
  nameserver-policy:
    "+.ts.net": "100.100.100.100"
  # 境外 DNS fallback 走代理节点解析，防止受到本地 DNS 污染
  respect-rules: true

# 流量嗅探（对浏览器 DoH 或直连纯 IP 连接提取 SNI 回挂规则）
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# TUN 模式（Clash Verge Rev 默认通过客户端 UI 打开 TUN）
tun:
  enable: false
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: false

proxies:
  - name: "hy2-node"
    type: hysteria2
    server: <SERVER_IP>
    port: 2443
    password: "<PASSWORD>"
    sni: www.bing.com
    skip-cert-verify: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "hy2-node"
      - DIRECT

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400
  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400
  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400
  tld-not-cn:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt"
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

rules:
  # === 1. 直连例外（防回环/内网）===
  - IP-CIDR,<SERVER_IP>/32,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # === 2. QUIC 回退（阻断 UDP:443 逼退浏览器回退 TCP，防止 AI 站点 HTTP/3 握手卡顿）===
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # === 3. AI 桌面端与 CLI 进程兜底（强行走代理）===
  - PROCESS-NAME,Claude.exe,PROXY
  - PROCESS-NAME,Claude Helper.exe,PROXY
  - PROCESS-NAME,Claude Helper (Renderer).exe,PROXY
  - PROCESS-NAME,Claude Helper (GPU).exe,PROXY
  - PROCESS-NAME,claude.exe,PROXY
  - PROCESS-NAME,Claude,PROXY
  - PROCESS-NAME,Claude Helper,PROXY
  - PROCESS-PATH-REGEX,(?i)[\\/]Claude[^\\/]*\.exe$,PROXY

  # === 4. Anthropic / Claude 域名与官方 IP 段 ===
  - GEOSITE,anthropic,PROXY
  - DOMAIN-KEYWORD,anthropic,PROXY
  - DOMAIN-KEYWORD,claude,PROXY
  - DOMAIN-SUFFIX,anthropic.com,PROXY
  - DOMAIN-SUFFIX,claude.ai,PROXY
